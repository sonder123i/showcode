name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK 且已接受 licenses；缺的 platform 由 AGP 自己拉。
      # 不用 android-actions/setup-android：它会去装 Google 已下架的 tools 包，直接 exit 1。
      - name: 单元测试与调试包
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/**
          retention-days: 14

  release:
    # 只有打了 v* 标签、且仓库配了签名密钥时才跑。
    # 没配密钥时这个 job 干净地跳过，而不是留一个红叉——
    # 因为 AGP 对缺密钥的行为是硬失败（不会产出未签名的包），
    # 那是正确的构建语义，但不该由一个还没准备好的仓库来承担。
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      secrets.SHOWCODE_KEYSTORE_BASE64 != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 写入签名材料
        env:
          SHOWCODE_KEYSTORE_BASE64: ${{ secrets.SHOWCODE_KEYSTORE_BASE64 }}
          SHOWCODE_KEYSTORE_PASSWORD: ${{ secrets.SHOWCODE_KEYSTORE_PASSWORD }}
          SHOWCODE_KEY_PASSWORD: ${{ secrets.SHOWCODE_KEY_PASSWORD }}
        run: |
          echo "$SHOWCODE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SHOWCODE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEY_ALIAS=showcode" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEYSTORE_PASSWORD=$SHOWCODE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEY_PASSWORD=$SHOWCODE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: 打 release 包
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
