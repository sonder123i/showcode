name: CI

on:
  push:
    branches: [main]
    # 没有这一行，release job 就是死代码：GitHub 在 push 带了 branches 过滤器时
    # 一律不为标签触发工作流，而它自己的 if 却要求 refs/tags/v*。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK 且已接受 licenses；缺的 platform 由 AGP 自己拉。
      # 不用 android-actions/setup-android：它会去装 Google 已下架的 tools 包，直接 exit 1。
      - name: 单元测试与调试包
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      # 视觉棘轮：和 core/parse/corpus 那条识别棘轮同一个道理，地板只许更好。
      # 不跑在 CI 里的话，本地量完下次被人改回去是没人知道的。
      - name: 视觉系统棘轮
        run: python3 tools/visual-audit.py --ci

      # 库结构棘轮。`data/` 一层没有测试框架（不引 Robolectric 那条取舍仍然成立），
      # 所以 SQL 写错在 JVM 单测里够不着——而这一类错的后果是「老库升级后第一次读到就崩」。
      # 它同时守住三件会各自漂的事：加了表忘写迁移、同一张表的两份 DDL 漂了、
      # 以及 DAO 里的列名对不上升过级的库。纯 python 标准库，不需要 SDK 也不需要设备。
      - name: 库结构与迁移棘轮
        run: python3 tools/migration-check.py --ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/**
          retention-days: 14

  release:
    # 只在 v* 标签上跑。密钥配没配用下面那个 gate 步骤判：
    # jobs.*.if 里拿不到 secrets 上下文（写上去整个工作流解析失败、0 秒红叉），
    # 而"没配密钥"是还没准备好的正常状态，不该在公开仓库上留一个失败标记。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 要建 GitHub Release；默认 token 没这个权限
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查有没有配签名密钥
        id: gate
        env:
          KEYSTORE_B64: ${{ secrets.SHOWCODE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::仓库还没配 SHOWCODE_KEYSTORE_BASE64，跳过签名包"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 写入签名材料
        if: steps.gate.outputs.ready == 'true'
        env:
          SHOWCODE_KEYSTORE_BASE64: ${{ secrets.SHOWCODE_KEYSTORE_BASE64 }}
          SHOWCODE_KEYSTORE_PASSWORD: ${{ secrets.SHOWCODE_KEYSTORE_PASSWORD }}
          SHOWCODE_KEY_PASSWORD: ${{ secrets.SHOWCODE_KEY_PASSWORD }}
        run: |
          echo "$SHOWCODE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SHOWCODE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEY_ALIAS=showcode" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEYSTORE_PASSWORD=$SHOWCODE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEY_PASSWORD=$SHOWCODE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: 打 release 包
        if: steps.gate.outputs.ready == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # 完全离线的 App，用户没有别的手段判断「我下到的这个包是不是官方构建的那个」，
      # 所以 SHA-256 必须和 APK 一起出现在下载页上。
      - name: 按版本号命名并算校验和
        if: steps.gate.outputs.ready == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "showcode-$VERSION.apk"
          sha256sum "showcode-$VERSION.apk" | tee SHA256SUMS.txt
          echo "APK=showcode-$VERSION.apk" >> "$GITHUB_ENV"

      - name: 发布到 GitHub Release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 更新说明只维护一份：fastlane 里对应 versionCode 的 changelog。
          # 找不到就退回 GitHub 自动生成的 notes，而不是让发布卡在这一步。
          CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          NOTES="fastlane/metadata/android/zh-CN/changelogs/$CODE.txt"
          TITLE="亮码 ${GITHUB_REF_NAME#v}"
          # 这个标签可能已经有一个 Release 了——维护者在本机签好上传过一次。
          # 那时覆盖而不是报错：配好 Secrets 之后重跑同一个标签，就能收敛成 CI 构建的包。
          # （APK 和 SHA256SUMS.txt 一起换，所以 sha256sum -c 仍然自洽；签名钥匙没变，
          #   README 里那个证书指纹也仍然对得上。）
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$NOTES"
            else
              gh release edit "$GITHUB_REF_NAME" --title "$TITLE"
            fi
            gh release upload "$GITHUB_REF_NAME" "$APK" SHA256SUMS.txt --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" \
              --notes-file "$NOTES" "$APK" SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" \
              --generate-notes "$APK" SHA256SUMS.txt
          fi
