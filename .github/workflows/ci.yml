name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK 且已接受 licenses；缺的 platform 由 AGP 自己拉。
      # 不用 android-actions/setup-android：它会去装 Google 已下架的 tools 包，直接 exit 1。
      - name: 单元测试与调试包
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/**
          retention-days: 14

  release:
    # 只在 v* 标签上跑。密钥配没配用下面那个 gate 步骤判：
    # jobs.*.if 里拿不到 secrets 上下文（写上去整个工作流解析失败、0 秒红叉），
    # 而"没配密钥"是还没准备好的正常状态，不该在公开仓库上留一个失败标记。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 要建 GitHub Release；默认 token 没这个权限
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查有没有配签名密钥
        id: gate
        env:
          KEYSTORE_B64: ${{ secrets.SHOWCODE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::仓库还没配 SHOWCODE_KEYSTORE_BASE64，跳过签名包"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 写入签名材料
        if: steps.gate.outputs.ready == 'true'
        env:
          SHOWCODE_KEYSTORE_BASE64: ${{ secrets.SHOWCODE_KEYSTORE_BASE64 }}
          SHOWCODE_KEYSTORE_PASSWORD: ${{ secrets.SHOWCODE_KEYSTORE_PASSWORD }}
          SHOWCODE_KEY_PASSWORD: ${{ secrets.SHOWCODE_KEY_PASSWORD }}
        run: |
          echo "$SHOWCODE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SHOWCODE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEY_ALIAS=showcode" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEYSTORE_PASSWORD=$SHOWCODE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SHOWCODE_KEY_PASSWORD=$SHOWCODE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: 打 release 包
        if: steps.gate.outputs.ready == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # 完全离线的 App，用户没有别的手段判断「我下到的这个包是不是官方构建的那个」，
      # 所以 SHA-256 必须和 APK 一起出现在下载页上。
      - name: 按版本号命名并算校验和
        if: steps.gate.outputs.ready == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "showcode-$VERSION.apk"
          sha256sum "showcode-$VERSION.apk" | tee SHA256SUMS.txt
          echo "APK=showcode-$VERSION.apk" >> "$GITHUB_ENV"

      - name: 发布到 GitHub Release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 更新说明只维护一份：fastlane 里对应 versionCode 的 changelog。
          # 找不到就退回 GitHub 自动生成的 notes，而不是让发布卡在这一步。
          CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          NOTES="fastlane/metadata/android/zh-CN/changelogs/$CODE.txt"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "亮码 ${GITHUB_REF_NAME#v}" \
              --notes-file "$NOTES" "$APK" SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "亮码 ${GITHUB_REF_NAME#v}" \
              --generate-notes "$APK" SHA256SUMS.txt
          fi
